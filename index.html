<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="הבר"><meta name="theme-color" content="#15100E"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>הבר של סילבי וצואי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Assistant:wght@400;500;600;700&family=Playpen+Sans+Hebrew:wght@700;800&family=Karantina:wght@700&display=swap">
<style>
/* Layout: dark frosted-glass bar at night. Three panels (backlit shelves · shaker · bartender) over warm ambient glows; phones stack them with a bottom nav. */
:root{
  /* single dark look, chosen on purpose to match the reference */
  --bg:#15100E;
  --glow1:rgba(242,164,110,.24); --glow2:rgba(232,140,156,.15); --glow3:rgba(126,200,165,.09);
  --surface:rgba(255,244,235,.055); --surface-2:rgba(255,244,235,.09); --solid:#221A16;
  --ink:#F7EEE6; --muted:#BBAEA2; --line:rgba(255,236,220,.13);
  --accent:#F2A46E; --accent-2:#E98B66; --accent-soft:rgba(242,164,110,.16); --on-accent:#2A1810;
  --grad:linear-gradient(135deg,#F8BE8E,#EC8E64);
  --berry:#F0A0AE; --berry-soft:rgba(240,160,174,.14);
  --good:#8ED7AE; --good-soft:rgba(142,215,174,.14); --warn:#F3C779; --warn-soft:rgba(243,199,121,.14); --bad:#F2918A; --bad-soft:rgba(242,145,138,.15);
  --glass:#D9CBBF; --btl-stroke:#D9CBBF;
  --blur:blur(20px) saturate(140%);
  --shadow:0 18px 50px rgba(0,0,0,.38);
  --f-display:"Rubik","Assistant","Arial Hebrew",Arial,sans-serif;
  --f-body:"Assistant","Rubik","Segoe UI","Arial Hebrew",Arial,sans-serif;
  --r:26px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:
  radial-gradient(900px 620px at 88% -8%,var(--glow1),transparent 62%),
  radial-gradient(720px 520px at -5% 35%,var(--glow2),transparent 62%),
  radial-gradient(900px 600px at 50% 112%,var(--glow3),transparent 60%),
  var(--bg);background-attachment:fixed;min-height:100%;
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:1380px;margin:0 auto;padding-block:22px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
.glassy{background:var(--surface);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),var(--shadow)}

/* Header + hero */
header.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,540px);gap:20px;align-items:center;margin-bottom:22px}
.hello{margin:0 0 6px;color:var(--muted);font-size:1.05rem;font-weight:600}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,4.6vw,3.4rem);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.93rem;color:var(--muted);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
.hero{border-radius:var(--r);padding:20px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;position:relative;overflow:hidden;min-height:170px}
.hero::after{content:"";position:absolute;inset:auto -60px -80px auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(242,164,110,.35),transparent 65%);pointer-events:none}
.hero .kicker{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;color:var(--accent)}
.hero h2{font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1.1;margin:6px 0 2px}
.hero h2 span{display:block;color:var(--accent);font-size:1.15rem;font-weight:700;margin-top:2px}
.hero p{margin:4px 0 12px;color:var(--muted);font-size:.93rem}
.hero-art{position:relative;z-index:1;width:132px;height:150px;display:grid;place-items:center}
.hero-art svg{width:120px;height:auto;filter:drop-shadow(0 12px 18px rgba(0,0,0,.45))}
.hero-badge{position:absolute;top:2px;inset-inline-end:-2px;width:58px;height:58px;border-radius:50%;background:var(--solid);border:1px solid var(--line);
  display:grid;place-items:center;text-align:center;font-size:.72rem;line-height:1.1;color:var(--muted);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.hero-badge b{display:block;font-family:var(--f-display);font-size:1.15rem;color:var(--ink)}

.app{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 10px;flex-wrap:wrap}
.panel-h h2,.bt-head h2{font-family:var(--f-display);font-weight:700;font-size:1.3rem;margin:0}
.panel-b{padding:0 20px 20px}
.hint{color:var(--muted);font-size:.9rem;margin:0}

/* Tabs */
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.22);border:1px solid var(--line);padding:4px;border-radius:999px}
.tab{border:0;background:transparent;padding:6px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--grad);color:var(--on-accent);box-shadow:0 4px 14px rgba(236,142,100,.3)}
.tab .n{font-variant-numeric:tabular-nums;opacity:.75;margin-inline-start:4px}

/* Shelf tools */
.tools{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.search{width:100%;border:1px solid var(--line);background:rgba(0,0,0,.22);border-radius:999px;padding:11px 18px;font:inherit;color:var(--ink)}
.search::placeholder{color:var(--muted)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.cat{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 7px;border:1px solid var(--line);
  background:var(--surface-2);border-radius:18px;font-size:.76rem;font-weight:600;cursor:pointer;color:var(--muted);line-height:1.15;text-align:center}
.cat svg{height:34px;width:auto}
.cat .all-ico{height:34px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem;color:var(--ink)}
.cat[aria-pressed="true"]{background:linear-gradient(160deg,rgba(248,190,142,.32),rgba(236,142,100,.18));border-color:rgba(242,164,110,.7);color:var(--ink);box-shadow:0 6px 18px rgba(236,142,100,.22)}
.group{margin-top:14px}
.group h3,.shelf-unit h3{font-size:.8rem;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px;padding-inline-start:12px;border:1px solid var(--line);
  background:var(--surface-2);border-radius:999px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  touch-action:pan-y;transition:transform .15s,border-color .15s,background .15s;font-weight:500}
.chip:hover{border-color:rgba(242,164,110,.5);transform:translateY(-1px)}
.chip.owned{background:var(--accent-soft);border-color:rgba(242,164,110,.45)}
.chip.inmix{outline:2px dashed var(--accent);outline-offset:2px}
.drop{width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);flex:none}
.own{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.25);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none;padding:0}
.chip.owned .own{background:var(--grad);border-color:transparent;color:var(--on-accent)}
.own svg{width:14px;height:14px}
.empty-note{color:var(--muted);padding:18px 0;text-align:center}

/* Backlit shelves */
.shelf-unit{margin-top:16px}
.shelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));grid-auto-rows:156px;column-gap:4px;border-radius:18px;padding:0 10px;overflow:hidden;
  background:
   linear-gradient(to bottom,transparent 0 135px,#C08C5A 135px 137px,#94643A 137px 141px,#82552F 141px 146px,#6E4626 146px 150px,#4A2E18 150px 152px,rgba(0,0,0,.45) 152px 156px) 0 0/100% 156px repeat-y,
   linear-gradient(to bottom,transparent 0 139px,rgba(255,226,190,.12) 139px 140px,transparent 140px 143px,rgba(40,20,8,.25) 143px 144px,transparent 144px 147px,rgba(255,226,190,.08) 147px 148px,transparent 148px) 0 0/100% 156px repeat-y,
   repeating-linear-gradient(90deg,transparent 0 37px,rgba(40,20,8,.18) 37px 38px,transparent 38px 91px,rgba(255,226,190,.05) 91px 92px,transparent 92px 130px) 0 0/100% 100%,
   linear-gradient(to bottom,transparent 0 110px,rgba(0,0,0,.28) 135px,transparent 135px) 0 0/100% 156px repeat-y,
   repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 64px,rgba(0,0,0,.06) 64px 66px),
   linear-gradient(180deg,#2A1D15,#20160F);
  box-shadow:inset 0 0 0 1px rgba(255,220,180,.10),inset 0 14px 30px rgba(0,0,0,.4)}
.btl{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:20px;cursor:grab;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:pan-y;position:relative;min-width:0;-webkit-tap-highlight-color:transparent}
.btl::before{content:"";position:absolute;left:50%;bottom:20px;width:110px;height:150px;transform:translateX(-50%);pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 50% 85% at 50% 100%,rgba(255,222,170,.62),rgba(255,190,120,.18) 55%,transparent 75%);
  clip-path:polygon(40% 100%,60% 100%,100% 0,0 0);opacity:0;transition:opacity .25s}
.btl::after{content:"";position:absolute;left:50%;bottom:19px;width:30px;height:5px;border-radius:50%;transform:translateX(-50%);pointer-events:none;z-index:2;
  background:radial-gradient(ellipse,#FFF4DE 0,rgba(255,214,150,.9) 40%,transparent 72%);opacity:0;transition:opacity .25s;box-shadow:0 0 14px 4px rgba(255,200,130,.45)}
.btl svg{height:96px;width:auto;overflow:visible;position:relative;z-index:1;transition:transform .25s cubic-bezier(.3,1.4,.5,1),filter .25s;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45)) brightness(.92)}
.btl.lit::before,.btl.lit::after{opacity:1}
.btl.lit svg{transform:translateY(-4px);filter:drop-shadow(0 -6px 14px rgba(255,200,140,.55)) drop-shadow(0 4px 4px rgba(0,0,0,.4)) brightness(1.18) saturate(1.1)}
@media (hover:hover){.btl:hover::before,.btl:hover::after{opacity:1}
  .btl:hover svg{transform:translateY(-4px);filter:drop-shadow(0 -6px 14px rgba(255,200,140,.55)) drop-shadow(0 4px 4px rgba(0,0,0,.4)) brightness(1.18) saturate(1.1)}}
.btl .bn{position:absolute;bottom:5px;left:2px;right:2px;z-index:3;font-size:.68rem;font-weight:700;line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:#F6E3C8;text-shadow:0 1px 0 rgba(0,0,0,.55)}
.btl.inmix .bn{color:#FFD39E}
.btl.inmix svg{transform:translateY(-3px)}
.btl-stroke{stroke:var(--btl-stroke)}
.lifted{opacity:.35}
.ghost.btl{background:var(--solid);padding:8px 10px;border-radius:16px;width:90px;border:1px solid var(--line)}
.shelf-empty{padding:26px 16px;text-align:center;color:var(--muted);background:rgba(0,0,0,.22);border-radius:18px;margin-top:14px}
.sample-note{margin:0 20px 12px;font-size:.88rem;color:var(--muted);background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}

/* Bottle photo */
.scan{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:1px solid rgba(242,164,110,.4);
  background:linear-gradient(135deg,rgba(248,190,142,.16),rgba(236,142,100,.08));border-radius:20px;padding:10px 14px;cursor:pointer;transition:border-color .15s,transform .15s}
.scan:hover{border-color:var(--accent);transform:translateY(-1px)}
.scan .cam{width:42px;height:42px;border-radius:14px;background:var(--grad);color:var(--on-accent);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(236,142,100,.35)}
.scan .cam svg{width:22px;height:22px}
.scan b{display:block;font-size:1rem}
.scan small{color:var(--muted);font-size:.86rem}
.scan-photo{width:100%;max-height:220px;object-fit:contain;border-radius:16px;background:rgba(0,0,0,.3);display:block;margin-bottom:14px}
.scan-status{display:flex;align-items:center;gap:10px;color:var(--muted);margin:0 0 14px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* Mixer */
.mixer-col{position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
#mixer{border:2px dashed transparent;border-radius:22px;margin:0 12px;padding:8px;transition:border-color .2s,background .2s}
#mixer.over{border-color:var(--accent);background:var(--accent-soft)}
.glass-wrap{display:grid;place-items:center;position:relative}
.glass-wrap::before{content:"";position:absolute;width:78%;aspect-ratio:1;max-width:100%;border-radius:50%;bottom:4%;background:radial-gradient(circle,rgba(242,164,110,.28),transparent 66%);pointer-events:none}
.glass-box{position:relative;width:min(200px,62%);transform-origin:50% 95%;margin-top:40px}
svg.glass{width:100%;height:auto;display:block;overflow:visible;position:relative;z-index:1;pointer-events:none}
#lq{position:absolute;left:0;top:-60%;width:100%;height:160%;z-index:0;pointer-events:none}
#tin{position:absolute;z-index:2;left:2%;width:96%;top:-52%;opacity:0;pointer-events:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.4))}
.ice-note{display:flex;gap:8px;align-items:flex-start;justify-content:center;margin:10px auto 0;max-width:360px;font-size:.88rem;color:var(--muted);text-align:start}
.ice-note svg{flex:none;margin-top:2px}
.ice-note b{color:var(--ink)}
.ice-note .mixed{color:var(--good);font-weight:700}
.glass-outline{fill:none;stroke:var(--glass);stroke-opacity:.85;stroke-width:3.5;stroke-linejoin:round}
.glass-fill{fill:#fff;fill-opacity:.05}
.glass-base{fill:var(--glass);opacity:.3}
.layer{transform-box:fill-box;transform-origin:50% 50%}
.ice rect{fill:#fff;fill-opacity:.3;stroke:#fff;stroke-opacity:.65;stroke-width:2;transition:opacity .4s}
.bub{fill:#fff;fill-opacity:.65;animation:rise 2.8s linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-150px);opacity:0}}
.drop-hint{position:absolute;inset:auto 0 46%;text-align:center;color:var(--muted);font-weight:600;pointer-events:none;font-size:.95rem}
.mix-items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:32px;margin-top:10px}
.mi{display:inline-flex;align-items:center;gap:6px;padding:3px 4px;padding-inline-start:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.9rem;animation:pop .3s}
.mi button{border:0;background:transparent;cursor:pointer;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted);padding:0}
.mi button:hover{background:var(--line);color:var(--ink)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.mix-actions{display:flex;justify-content:center;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:600;font-size:.94rem}
.btn:hover{border-color:rgba(242,164,110,.5)}
.btn.primary{background:var(--grad);color:var(--on-accent);border-color:transparent;font-weight:700;box-shadow:0 8px 20px rgba(236,142,100,.35)}
.btn.primary:hover{filter:brightness(1.05)}
.btn[disabled]{opacity:.4;cursor:default}

.verdict{margin:14px 20px 20px;border-radius:20px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--line)}
.verdict .badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.8rem;padding:2px 11px;border-radius:999px;background:var(--line);color:var(--ink)}
.verdict h3{font-family:var(--f-display);font-size:1.22rem;margin:8px 0 4px;font-weight:700;text-wrap:balance}
.verdict p{margin:0 0 6px;color:var(--muted)}
.verdict.perfect{background:var(--good-soft);border-color:rgba(142,215,174,.25)}.verdict.perfect .badge{background:var(--good);color:var(--on-accent)}
.verdict.good{background:var(--accent-soft);border-color:rgba(242,164,110,.28)}.verdict.good .badge{background:var(--grad);color:var(--on-accent)}
.verdict.maybe{background:var(--warn-soft);border-color:rgba(243,199,121,.25)}.verdict.maybe .badge{background:var(--warn);color:var(--on-accent)}
.verdict.bad{background:var(--bad-soft);border-color:rgba(242,145,138,.25)}.verdict.bad .badge{background:var(--bad);color:var(--on-accent)}
.tips{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.94rem}
.tips li{display:flex;gap:8px}
.tips li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;margin-top:.6em}

/* Recipe rows */
.rlist{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:9px 6px;border-top:1px solid var(--line);cursor:pointer;background:transparent;border-inline:0;border-bottom:0;text-align:start;width:100%;border-radius:0;color:inherit}
.rrow:first-child{border-top:0}
.rrow:hover{background:rgba(255,255,255,.04)}
.rico{width:42px;height:46px;border-radius:14px;background:rgba(0,0,0,.25);display:grid;place-items:center;border:1px solid var(--line)}
.rico svg{width:30px;height:auto}
.rname{font-family:var(--f-display);font-weight:600;font-size:1.04rem;line-height:1.2}
.rmeta{font-size:.85rem;color:var(--muted)}
.rmeta .miss{color:var(--berry);font-weight:600}
.rmeta .ok{color:var(--good);font-weight:600}
.tag{font-size:.76rem;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted);white-space:nowrap;background:rgba(0,0,0,.15)}
.buy{margin:0 20px 14px;padding:12px 14px;border-radius:18px;background:var(--berry-soft);display:flex;gap:12px;align-items:center}
.buy .drop{width:20px;height:20px}
.buy b{font-family:var(--f-display);font-size:1rem}
.buy p{margin:0;font-size:.9rem;color:var(--muted)}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(8,5,4,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:80;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:rgba(36,27,23,.94);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:28px;max-width:520px;width:100%;max-height:calc(100% - 20px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.55);border:1px solid var(--line);color:var(--ink)}
.m-head{display:flex;gap:16px;align-items:center;padding:22px 22px 8px}
.m-head .rico{width:72px;height:80px;border-radius:20px}
.m-head .rico svg{width:52px}
.m-head h2{font-family:var(--f-display);font-weight:800;font-size:1.8rem;margin:0;line-height:1.1}
.m-head .en{color:var(--muted);font-size:.95rem;direction:ltr;text-align:right}
.m-body{padding:8px 22px 22px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.ing-list{list-style:none;margin:0 0 14px;padding:0;border:1px solid var(--line);border-radius:18px;background:rgba(0,0,0,.18)}
.ing-list li{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.ing-list li:first-child{border-top:0}
.ing-list .amt{margin-inline-start:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.94rem;white-space:nowrap}
.ing-list .st{font-size:.8rem;font-weight:700;width:46px;text-align:center;border-radius:999px;padding:1px 0}
.ing-list .st.y{background:var(--good-soft);color:var(--good)}
.ing-list .st.n{background:var(--berry-soft);color:var(--berry)}
.ing-list .opt{font-size:.8rem;color:var(--muted)}
.ing-list .tgl{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap}
.ing-list .tgl.on{background:var(--good-soft);color:var(--good);border-color:transparent}
.ing-list .lbl{font-size:.85rem;color:var(--muted)}
.steps{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:0 0 16px}
.steps ol{margin:4px 0 0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:st;display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:.95rem;line-height:1.45}
.steps li::before{content:counter(st);width:24px;height:24px;border-radius:50%;background:var(--grad);color:var(--on-accent);font-weight:800;font-size:.8rem;display:grid;place-items:center;font-family:var(--f-display)}
.steps .tipline{margin:10px 0 0;font-size:.86rem;color:var(--muted)}
.verdict .steps{margin:12px 0 0;background:rgba(0,0,0,.2)}
/* Shaker vessel */
.v-glass,.v-shaker{transition:opacity .45s}
.v-shaker{opacity:0}
.glass-box.shaker .v-shaker{opacity:1}
.glass-box.shaker .v-glass{opacity:.15}
.steps b{display:block;font-size:.8rem;color:var(--accent);margin-bottom:2px}
.m-actions{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap}

/* Drag ghost + toast */
.ghost{position:fixed;z-index:60;pointer-events:none;box-shadow:0 14px 34px rgba(0,0,0,.45);top:0;left:0}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--solid);color:var(--ink);border:1px solid var(--line);
  padding:9px 18px;border-radius:999px;font-weight:600;z-index:90;box-shadow:var(--shadow);animation:pop .25s;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}

/* Bartender */
.bartender{display:flex;flex-direction:column}
.bt-head{display:flex;align-items:center;gap:12px;padding:18px 20px 10px}
.avatar{width:52px;height:52px;flex:none;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent),0 8px 20px rgba(236,142,100,.3)}
.avatar svg{width:100%;height:100%;display:block}
.chat{display:flex;flex-direction:column;gap:10px;padding:6px 20px 12px;max-height:560px;overflow-y:auto}
.msg{max-width:92%;border-radius:20px;padding:10px 14px;font-size:.97rem;animation:pop .25s;min-width:0}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.msg.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-start-start-radius:6px}
.msg.user{align-self:flex-end;background:var(--grad);color:var(--on-accent);font-weight:600;border-start-end-radius:6px}
.msg .rlist{margin-top:6px;background:rgba(0,0,0,.2);border-radius:16px;padding:0 8px;border:1px solid var(--line)}
.msg .rrow{padding:8px 2px}
.msg .why{display:block;font-size:.84rem;color:var(--muted)}
.creation{margin-top:8px;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.creation b{font-family:var(--f-display);font-size:1.08rem}
.creation ul{margin:6px 0;padding:0;list-style:none;font-size:.92rem}
.creation li{display:flex;gap:8px;align-items:center;padding:2px 0}
.creation li .amt{margin-inline-start:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.creation .btn{margin-top:6px;padding:5px 14px;font-size:.88rem}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 10px}
.quick button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 13px;font-size:.87rem;cursor:pointer;color:var(--ink)}
.quick button:hover{border-color:var(--accent);background:var(--accent-soft)}
.ask{display:flex;gap:8px;padding:0 20px 18px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);background:rgba(0,0,0,.24);border-radius:999px;padding:11px 18px;font:inherit;color:var(--ink)}
.ask input::placeholder{color:var(--muted)}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--grad);color:var(--on-accent);display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 8px 20px rgba(236,142,100,.35)}
.send[disabled]{opacity:.5;cursor:default}
.all-recs{border-top:1px solid var(--line)}
.all-recs summary{cursor:pointer;padding:14px 20px;font-weight:700;color:var(--muted)}
.all-recs[open] summary{color:var(--ink)}

/* Pour animation */
.pour-btl{position:fixed;z-index:65;pointer-events:none;transform-origin:50% 50%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.pour-btl svg{width:100%;height:100%;display:block;overflow:visible}
.pour-stream{position:fixed;z-index:64;width:5px;border-radius:3px;pointer-events:none;transform-origin:50% 0;box-shadow:0 0 8px rgba(255,255,255,.15)}
.pour-drop{position:fixed;z-index:66;border-radius:50%;pointer-events:none}

/* House cats */
.panel{position:relative}
header.top{margin-bottom:132px}
.cat-host{position:absolute;top:-136px;width:140px;height:154px;z-index:5;cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
#catBar{inset-inline-start:30px}
#catBartender{inset-inline-end:30px}
.cat-say{position:absolute;top:-112px;z-index:5;max-width:min(230px,calc(100% - 200px));background:var(--solid);border:1px solid var(--line);color:var(--ink);
  border-radius:18px;padding:9px 14px;font-size:.92rem;font-weight:600;box-shadow:var(--shadow);transition:opacity .35s,transform .35s;pointer-events:none}
.cat-say::after{content:"";position:absolute;top:22px;width:12px;height:12px;background:var(--solid);border:1px solid var(--line);transform:rotate(45deg)}
#sayBar{inset-inline-start:184px}#sayBar::after{inset-inline-start:-7px;border-top:0;border-inline-end:0}
#sayBartender{inset-inline-end:184px}#sayBartender::after{inset-inline-end:-7px;border-bottom:0;border-inline-start:0}
.cat-say.fade{opacity:0;transform:translateY(4px)}
.cat-svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.cat-head{transform-box:fill-box;transform-origin:50% 90%;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.cat-host:hover .cat-head,.cat-host:focus-visible .cat-head{transform:rotate(-7deg)}
#catBar:hover .cat-head{transform:rotate(7deg)}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:catblink 5.5s infinite}
#catBar .lid{animation-delay:2.3s;animation-duration:6.5s}
@keyframes catblink{0%,92%,100%{transform:scaleY(0)}95.5%{transform:scaleY(1)}}

/* Bottom nav (phones) */
.bnav{display:none}

@media (max-width:1080px){
  .app{grid-template-columns:minmax(0,1fr) minmax(0,1fr);row-gap:150px}
  .recs-col{grid-column:1 / -1}
  header.top{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .app{grid-template-columns:minmax(0,1fr);row-gap:104px}
  .mixer-col{position:static;order:-1}
  header.top{margin-bottom:22px}
  .cat-host{width:96px;height:106px;top:-91px}
  .cat-say{top:-74px;font-size:.84rem;max-width:calc(100% - 140px)}
  #sayBar{inset-inline-start:130px}#sayBartender{inset-inline-end:130px}
  .glass-box{width:min(160px,48%)}
  .hero{grid-template-columns:minmax(0,1fr) 110px;padding:18px}
  .hero-art{width:110px;height:130px}.hero-art svg{width:96px}
  .hero h2{font-size:1.45rem}
  .bnav{display:flex;position:fixed;z-index:70;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
    bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:24px;padding:8px;justify-content:space-around;
    background:rgba(34,26,22,.78);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:var(--shadow)}
  .bnav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:600;color:var(--muted);padding:6px 4px;border-radius:16px;cursor:pointer}
  .bnav button svg{width:22px;height:22px}
  .bnav button.on{color:var(--accent);background:var(--accent-soft)}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
}
/* ---- Batch 1: header buttons, bottle levels, journal, filters, party, prep mode ---- */
.hbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(242,164,110,.35);background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.92rem;cursor:pointer;min-height:40px}
.hbtn:hover{border-color:rgba(242,164,110,.7)}
.hbtn svg{width:18px;height:18px;color:var(--accent);flex:none}
.hbtn .n{background:var(--grad);color:var(--on-accent);border-radius:999px;min-width:22px;padding:0 6px;font-size:.8rem;text-align:center;font-variant-numeric:tabular-nums}
.hbtn .n:empty{display:none}
.lvl{position:absolute;top:2px;inset-inline-end:0;z-index:4;display:flex;flex-direction:column-reverse;gap:2px;padding:5px 6px;border:0;background:rgba(0,0,0,.42);border-radius:9px;cursor:pointer;touch-action:manipulation}
.lvl i{display:block;width:11px;height:4px;border-radius:2px;background:rgba(255,255,255,.16)}
.lvl.l3 i{background:var(--good)}
.lvl.l3{opacity:.6}
.lvl.l2 i:nth-child(-n+2){background:var(--warn)}
.lvl.l1 i:first-child{background:var(--bad)}
.lvl.l1{box-shadow:0 0 0 1.5px var(--bad);animation:lowPulse 1.6s ease-in-out infinite}
@keyframes lowPulse{50%{box-shadow:0 0 0 4px rgba(242,145,138,.25)}}
.btl.low .bn{color:var(--bad)}
.low-note[hidden]{display:none}
.sample-note[hidden]{display:none}
.low-note{margin:0 20px 12px;padding:9px 14px;border-radius:16px;background:var(--bad-soft);font-size:.9rem;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.fav{border:1px solid var(--line);background:var(--surface-2);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--muted)}
.fav svg{width:22px;height:22px}
.fav.on{color:var(--berry);background:var(--berry-soft);border-color:transparent}
.fav.on svg path{fill:currentColor}
.fav-dot{color:var(--berry);font-size:.8em;margin-inline-start:5px}
.mine{display:flex;align-items:center;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;margin:0 0 12px;font-size:.92rem;color:var(--muted)}
.stars{display:inline-flex;gap:0}
.stars button{border:0;background:none;font-size:1.5rem;line-height:1;padding:3px;cursor:pointer;color:rgba(255,236,220,.22);min-width:32px;min-height:36px}
.stars button.on{color:var(--warn)}
.st-txt{color:var(--warn);letter-spacing:1px}
.serve{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 10px;border:1px solid var(--line);border-radius:18px;background:rgba(0,0,0,.18);margin:0 0 12px}
.serve b{display:block;font-family:var(--f-display);font-size:1rem}
.serve small{color:var(--muted);font-size:.84rem}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:1.3rem;font-weight:700;cursor:pointer;display:grid;place-items:center;touch-action:manipulation}
.stepper button[disabled]{opacity:.35;cursor:default}
.stepper output{min-width:34px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.party-tip{margin:-4px 0 14px;font-size:.88rem;color:var(--muted);padding:8px 12px;border-radius:14px;background:var(--accent-soft)}
.tag.str-none{color:var(--good)}.tag.str-strong{color:var(--bad)}
.rb-tools{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.rb-tools .tabs{flex-wrap:wrap;border-radius:18px;align-self:flex-start}
.fchips{display:flex;flex-direction:column;gap:6px}
.fgrp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flbl{font-size:.8rem;color:var(--muted);width:34px;flex:none}
.fchip{border:1px solid var(--line);background:rgba(0,0,0,.15);border-radius:999px;padding:5px 12px;font-size:.86rem;font-weight:600;color:var(--muted);cursor:pointer;min-height:32px}
.fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:rgba(242,164,110,.6);color:var(--ink)}
.rcount{margin:0 0 4px}
.shop-list li{flex-wrap:wrap}
.shop-list .sname{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.shop-list .sname .lbl{font-size:.82rem}
.xmini{border:0;background:none;color:var(--muted);font-size:1.3rem;cursor:pointer;width:32px;height:32px;border-radius:50%}
.shop-add{display:flex;flex-direction:column;gap:4px;margin:0 0 14px}
.shop-add select{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:14px;padding:10px 12px;font:inherit}
.shop-add option,.shop-add optgroup{background:#221A16;color:var(--ink)}
body.noscroll{overflow:hidden}
#prepRoot{animation:fade .2s}
.prep{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;gap:8px;
  background:radial-gradient(800px 520px at 50% -10%,rgba(242,164,110,.2),transparent 62%),#120D0B;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.prep-top{display:flex;align-items:center;gap:12px;max-width:720px;width:100%;margin:0 auto}
.prep-title{flex:1;min-width:0}
.prep-title b{font-family:var(--f-display);font-size:1.25rem;display:block;line-height:1.2}
.prep-title span{color:var(--muted);font-size:.88rem}
.xbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:1.5rem;line-height:1;cursor:pointer;display:grid;place-items:center;flex:none}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;max-width:720px;width:100%;margin:4px auto 0}
.prog i{display:block;height:100%;background:var(--grad);transition:width .35s}
.prep-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;max-width:640px;margin:0 auto;width:100%;overflow:auto;padding:8px 0}
.pnum{color:var(--accent);font-weight:700}
.ptext{font-family:var(--f-display);font-weight:600;font-size:clamp(1.35rem,5.4vw,2.1rem);line-height:1.4;margin:0;text-wrap:balance;animation:stepIn .35s}
@keyframes stepIn{from{opacity:0;transform:translateY(10px)}}
.ptimer{position:relative;width:136px;height:136px;border-radius:50%;border:0;background:rgba(0,0,0,.28);cursor:pointer;display:grid;place-items:center;flex:none}
.ptimer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ptimer .tr{fill:none;stroke:rgba(255,255,255,.1);stroke-width:8}

.ptimer b{font-family:var(--f-display);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.ptimer small{color:var(--muted);font-size:.78rem;margin-top:4px}
.ptimer.done .tf{stroke:var(--good)}
.ptimer.done b{color:var(--good)}
.prep-ings{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.prep-cat{width:120px}
.prep-cat svg{width:100%;height:auto}
.prep-nav{display:flex;gap:10px;max-width:640px;width:100%;margin:0 auto}
.prep-nav .btn{flex:1;padding:15px;font-size:1.06rem}
.prep .stars button{font-size:2rem;min-width:44px;min-height:48px}
@media (max-width:720px){
  .hbtns{margin-top:12px}
  .hbtn{flex:1;justify-content:center}

}
/* ---- Batch 3: corner buttons, night neon, intro, served glass, share card ---- */
.cbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;color:var(--ink);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.cbtn svg{width:21px;height:21px}

<script>/* ---- Standalone app: AI through the owner's own API key (kept only on this phone) ---- */
(function(){
  const KEY="homebar:apikey", MODEL="claude-sonnet-5-5";
  const getKey=()=>{try{return localStorage.getItem(KEY)||""}catch(e){return ""}};
  window.HB_KEY={get:getKey,set:v=>{try{v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY)}catch(e){}}};
  const b64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)});
  const err=code=>{const e=new Error(code);e.code=code;return e};
  function parseJson(t){t=String(t||"").trim().replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"");
    try{return JSON.parse(t)}catch(e){const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e2){}}throw err("bad_json")}}
  async function json(input,opts){
    opts=opts||{};const key=getKey();if(!key)throw err("not_granted");
    let msgs=typeof input==="string"?[{role:"user",content:input}]:input.map(m=>({role:m.role,content:String(m.content)}));
    while(msgs.length&&msgs[0].role!=="user")msgs.shift();
    if(opts.images&&opts.images.length){
      const last=msgs[msgs.length-1], blocks=[];
      for(const im of opts.images)blocks.push({type:"image",source:{type:"base64",media_type:im.type||"image/jpeg",data:await b64(im)}});
      blocks.push({type:"text",text:last.content});last.content=blocks;
    }
    let r;
    try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:opts.signal,
      headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:MODEL,max_tokens:1500,messages:msgs})})}
    catch(e){if(e&&e.name==="AbortError")throw err("cancelled");throw err("offline")}
    if(r.status===429||r.status===529)throw err("rate_limited");
    if(r.status===401||r.status===403)throw err("bad_key");
    if(!r.ok)throw err("api_error");
    const d=await r.json();
    return parseJson((d.content||[]).filter(c=>c.type==="text").map(c=>c.text).join(""));
  }
  const sample={json,limits:async()=>({images:{mediaTypes:["image/jpeg","image/png","image/webp","image/heic","image/*"]}})};
  window.claude={use:async name=>name==="sample"&&getKey()?sample:null};
  if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>

/* ---------- Mixer: canvas liquid engine ---------- */
function mixHex(a,b,p){const x=hex(a),y=hex(b);return"#"+x.map((v,i)=>Math.round(v+(y[i]-v)*p).toString(16).padStart(2,"0")).join("")}
const gxL=y=>44+11*Math.max(0,Math.min(194,y-26))/194, gxR=y=>156-11*Math.max(0,Math.min(194,y-26))/194;
function glassLevel(n){return n?Math.min(1,.22+n*.14):0}
const GLASS_D="M44 26 L156 26 L145 220 Q144 230 134 230 L66 230 Q56 230 55 220 Z";
const TAU=Math.PI*2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), smooth=p=>p*p*(3-2*p);

const FIZZ=["soda","tonic","cola","ginger_beer","prosecco"];
const LQ={cv:null,ctx:null,s:1,layers:[],explode:false,t:0,tw:[],raf:0,last:0,
  turb:0,slosh:0,phase:0,tilt:0,foam:0,spoon:0,spoonAng:0,jit:0,showIce:true,bub:[],fizzy:false,mixedIds:[],busy:false};
let GP=null;
function lqInit(){
  LQ.cv=$("#lq"); if(!LQ.cv||!LQ.cv.getContext)return; LQ.ctx=LQ.cv.getContext("2d"); GP=new Path2D(GLASS_D);
  lqResize(); try{new ResizeObserver(lqResize).observe(LQ.cv)}catch(e){addEventListener("resize",lqResize)}
}
function lqResize(){
  if(!LQ.cv)return; const r=LQ.cv.getBoundingClientRect(), d=Math.min(2,window.devicePixelRatio||1);
  if(!r.width)return; LQ.cv.width=Math.round(r.width*d); LQ.cv.height=Math.round(r.height*d); LQ.s=LQ.cv.width/200; lqDraw();
}
function exactRecipe(){
  if(mix.length<2)return null; const S=new Set(mix);
  return R.find(r=>[...S].every(i=>r.all.has(i))&&[...r.req].every(i=>S.has(i)))||null;
}
function iceInfo(r){
  if(!r)return null;
  const inGlass=["high","rocks","mug","wine"].includes(r.g)&&r.m!=="blend";
  if(r.m==="blend")return{inGlass:true,text:"טוחנים עם קרח, ומגישים קר מאוד"};
  if(inGlass)return{inGlass:true,text:r.m==="build"?"מוגש על הרבה קרח":r.m==="shake"?"מנערים עם קרח ומגישים על קרח טרי":"מערבבים עם קרח ומגישים על קרח"};
  return{inGlass:false,text:r.m==="shake"?"מנערים עם קרח ומסננים, בלי קרח בכוס":"מערבבים עם קרח ומסננים, בלי קרח בכוס"};
}
function recMethod(){
  const r=exactRecipe(); if(r)return r.m==="shake"||r.m==="blend"?"shake":"stir";
  return mix.some(i=>["lemon","lime","oj","pineapple","cranberry","grapefruit","cream","egg_white","honey","coconut","espresso","irish"].includes(i))?"shake":"stir";
}
/* Layers: anything already mixed is one blended layer at the bottom */
function lqLayout(keep){
  const n=mix.length, surf=26+(1-glassLevel(n))*204;
  let mixed=LQ.mixedIds.filter(id=>mix.includes(id));
  if(mixed.some((id,i)=>mix[i]!==id))mixed=[];
  LQ.mixedIds=mixed;
  const groups=[]; if(mixed.length>=2)groups.push(mixed); mix.slice(mixed.length>=2?mixed.length:0).forEach(id=>groups.push([id]));
  const ws=groups.map(g=>g.reduce((a,id)=>a+(I[id].w>=.3?1:.45),0)), tot=ws.reduce((a,b)=>a+b,0)||1, H=230-surf;
  let y=232; const out=[];
  groups.forEach((g,i)=>{
    let top=i===groups.length-1?surf:y-H*ws[i]/tot; if(i===0&&groups.length>1)top=Math.min(top,214);
    const old=keep&&LQ.layers[i]&&LQ.layers[i].key===g.join("+")?LQ.layers[i]:null;
    out.push({key:g.join("+"),col:blend(g),y0:y,y1:top,off:old?old.off:0,rot:old?old.rot:0,alpha:1});
    y=top;
  });

  LQ.fizzy=mix.some(i=>FIZZ.includes(i));
  const r=exactRecipe(), ice=iceInfo(r); LQ.showIce=n>0&&(!ice||ice.inGlass);
}
function renderGlass(mode){
  unserve();
  lqLayout(!mode);
  $("#dropHint").hidden=!!mix.length;
  if(!mix.length){LQ.foam=0}
  if(mode&&mix.length&&!window.matchMedia("(prefers-reduced-motion:reduce)").matches)lqExplode(mode);
  else lqKick();
  renderMixTools();
}
function tween(dur,fn,done,delay){LQ.tw.push({st:performance.now()+(delay||0),dur,fn,done});lqKick()}
/* The new drink (or every drink) hovers apart above the glass, then drops in and splashes */
function lqExplode(mode){
  const L=LQ.layers, n=L.length, gap=Math.min(26,130/n); LQ.explode=true; LQ.foam=mode==="all"?0:LQ.foam*.5;
  const plan=L.map((l,i)=>({fresh:mode==="all"||i===n-1,lift:gap*(i+1),rot:(i%2?1:-1)*(2.5+i%3),delay:mode==="all"?i*70:0}));
  const total=1500+(mode==="all"?n*70:0);
  tween(total,(p,el)=>{
    L.forEach((l,i)=>{
      const pl=plan[i], q=clamp((el-pl.delay)/1500,0,1);
      let off,rot,a=1;
      if(q<.32){const k=smooth(q/.32);off=pl.fresh?-(pl.lift+70)+(64*k):-(pl.lift+6)*k;rot=pl.fresh?pl.rot*(2-k):pl.rot*k;a=pl.fresh?k:1}
      else if(q<.62){const k=smooth((q-.32)/.3);off=-(pl.lift+6)+6*k;rot=pl.rot*(1-.4*k)}
      else{const k=backOut((q-.62)/.38);off=-pl.lift*(1-k);rot=pl.rot*.6*(1-k)}
      l.off=off;l.rot=rot;l.alpha=a;
    });
  },()=>{
    L.forEach(l=>{l.off=0;l.rot=0;l.alpha=1});LQ.explode=false;LQ.slosh=Math.max(LQ.slosh,6);
    const box=$(".glass-box");box&&box.animate([{transform:"translateY(0) scaleY(1)"},{transform:"translateY(3px) scaleY(.985)"},{transform:"none"}],{duration:420,easing:"ease-out"});
    if(mode==="all"||exactRecipe())setTimeout(()=>lqMix(recMethod()),350);
  });
}
/* Shake with a tin, or stir with a bar spoon: colours swirl and blend for real */
function lqMix(method){
  if(LQ.busy||mix.length<2)return;
  const already=LQ.mixedIds.length===mix.length; if(already&&method!=="shake"){lqKick();return}
  const reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  const finish=()=>{
    LQ.mixedIds=mix.slice(); lqLayout(false); LQ.layers.forEach(l=>{l.off=0;l.rot=0});
    LQ.busy=false; LQ.turb=method==="shake"?.5:.35; LQ.slosh=Math.max(LQ.slosh,method==="shake"?7:3);
    LQ.foam=method==="shake"?(mix.includes("egg_white")?1:.55):LQ.foam; renderMixTools(); lqKick();
    toast(method==="shake"?"מנוער ומוכן":"מעורבב ומוכן");
    if(exactRecipe())setTimeout(serveGlass,reduce?0:650);
  };
  if(reduce){finish();return}
  unserve(); LQ.busy=true; renderMixTools(); sfx(method==="shake"?"shake":"stir");
  const L=LQ.layers.map(l=>({...l})), target=blend(mix);
  LQ.layers.forEach(l=>{l.from=l.col});
  const blendTo=p=>LQ.layers.forEach(l=>{l.col=mixHex(l.from,target,p)});
  if(method==="shake"){
    const tin=$("#tin"), box=$(".glass-box"), asShaker=box.classList.contains("shaker");
    if(!asShaker)tin.animate([{transform:"translateY(-70%)",opacity:0},{transform:"translateY(0)",opacity:1}],{duration:380,easing:"cubic-bezier(.3,1.3,.5,1)",fill:"forwards"});
    const kf=[];for(let i=0;i<=16;i++){const s=i===0||i===16?0:(i%2?1:-1);kf.push({transform:`translate(${s*5}px,${-Math.abs(s)*10}px) rotate(${s*11}deg)`})}
    setTimeout(()=>box.animate(kf,{duration:1500,easing:"linear"}),420);
    tween(1500,(p)=>{
      const env=Math.sin(Math.PI*p);
      LQ.turb=.4+.6*env; LQ.jit=env; LQ.slosh=10*env+2; LQ.tilt=Math.sin(p*TAU*8)*.22*env;
      blendTo(smooth(clamp((p-.1)/.75,0,1)));
    },()=>{
      LQ.jit=0;LQ.tilt=0;
      if(!asShaker)tin.animate([{transform:"translateY(0)",opacity:1},{transform:"translateY(-80%)",opacity:0}],{duration:380,easing:"ease-in",fill:"forwards"});
      setTimeout(finish,250);
    },420);
  } else {
    tween(2300,(p)=>{
      LQ.spoon=p<.1?p/.1:p>.88?(1-p)/.12:1;
      LQ.spoonAng=smooth(p)*TAU*4;
      LQ.turb=.25+.6*Math.sin(Math.PI*p); LQ.slosh=2.5+2*Math.sin(Math.PI*p); LQ.tilt=Math.sin(LQ.spoonAng)*.05;

    },()=>{LQ.spoon=0;LQ.tilt=0;finish()});
  }
}
function lqKick(){if(!LQ.raf&&LQ.ctx){LQ.last=performance.now();LQ.raf=requestAnimationFrame(lqFrame)}}
function lqFrame(now){
  const dt=Math.min(.05,(now-LQ.last)/1000); LQ.last=now; LQ.t+=dt; LQ.phase+=dt*(3+LQ.slosh*.25);
  LQ.tw=LQ.tw.filter(w=>{if(now<w.st)return true;const el=now-w.st,p=clamp(el/w.dur,0,1);w.fn(p,el);if(p>=1){w.done&&w.done();return false}return true});
  if(!LQ.busy){LQ.slosh*=Math.pow(.93,dt*60);LQ.turb*=Math.pow(.95,dt*60);if(LQ.foam>.35&&!mix.includes("egg_white"))LQ.foam-=dt*.08}
  lqDraw();
  const alive=LQ.tw.length||LQ.slosh>.15||LQ.turb>.02||(LQ.fizzy&&mix.length);
  LQ.raf=alive?requestAnimationFrame(lqFrame):0;
}
function surfY(x){return LQ.surf+LQ.tilt*(x-100)+LQ.slosh*.5*Math.sin(x*.06+LQ.phase)+LQ.slosh*.25*Math.sin(x*.13-LQ.phase*1.3)}

function lqDraw(){
  const c=LQ.ctx; if(!c)return; const s=LQ.s;
  c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,LQ.cv.width,LQ.cv.height);
  c.setTransform(s,0,0,s,0,150*s);
  c.fillStyle="rgba(255,255,255,.05)"; c.fill(GP);
  const L=LQ.layers; if(!L.length)return;
  if(LQ.explode){
    L.forEach((l,i)=>{
      if(l.alpha<=0)return;
      c.save(); c.globalAlpha=l.alpha*(lum(l.col)>.86?.5:1);
      const cy=(l.y0+l.y1)/2; c.translate(100,cy+l.off); c.rotate(l.rot*Math.PI/180); c.translate(-100,-cy);
      c.beginPath(); c.moveTo(gxL(l.y1),l.y1); c.lineTo(gxR(l.y1),l.y1);
      if(i===0){c.lineTo(145,220);c.quadraticCurveTo(144,230,134,230);c.lineTo(66,230);c.quadraticCurveTo(56,230,55,220)}
      else{c.lineTo(gxR(l.y0),l.y0);c.lineTo(gxL(l.y0),l.y0)}

    const l=L[i], top=i===L.length-1;

    for(let x=36;x<=164;x+=4){const y=top?surfY(x):bndY(l.y1,x,i);x===36?c.moveTo(x,y):c.lineTo(x,y)}

    c.fillStyle="rgba(255,255,255,.6)";
    LQ.bub.forEach(b=>{b.y-=b.v*.016*(1+LQ.slosh*.05);b.x+=Math.sin(LQ.t*3+b.r)*.15;if(b.y<surfY(b.x)+2){b.y=226;b.x=62+Math.random()*76}

function lum(col){return hex(col).reduce((a,v,k)=>a+v*[.299,.587,.114][k],0)/255}

function drawIce(c,floating){
  if(!LQ.showIce||!mix.length)return;
  const cubes=[[82,30,-12],[114,28,16],[98,26,6]];
  cubes.forEach(([x,sz,r0],i)=>{
    let y=Math.min(surfY(x)-sz*.28+i*sz*.5, 224-sz/2);
    if(floating)y=Math.min(LQ.surf-sz*.28+i*sz*.5,224-sz/2);

    const rot=(r0+Math.sin(LQ.phase+i*1.7)*LQ.slosh*1.4+LQ.jit*(Math.random()-.5)*40)*Math.PI/180;
    c.save(); c.translate(x+jx,y+jy); c.rotate(rot);

    c.fillStyle="rgba(255,255,255,.26)"; c.fill(); c.strokeStyle="rgba(255,255,255,.7)"; c.lineWidth=1.6; c.stroke();
    c.fillStyle="rgba(255,255,255,.55)"; c.beginPath(); c.roundRect?c.roundRect(-h+4,-h+4,sz*.35,sz*.18,3):c.rect(-h+4,-h+4,sz*.35,sz*.18); c.fill();

/* Mix buttons + ice note */

}
/* Pour animation: the bottle flies over the glass, tilts and pours, the glass fills */
const POUR_MS=1400;
function pourAnim(id,from){
  if(window.matchMedia("(prefers-reduced-motion:reduce)").matches)return false;
  const gEl=$("svg.glass"); if(!gEl)return false;
  const g=gEl.getBoundingClientRect();
  if(g.bottom<40||g.top>innerHeight-40||!g.width)return false;
  const k=g.width/200;
  const n=mix.length+1, level=Math.min(1,.22+n*.14), surf=g.top+(26+(1-level)*204)*k;
  const mouthX=g.left+(100+18)*k, mouthY=g.top+14*k;
  const h=Math.max(70,Math.min(96,g.height*.42)), w=h*60/110;
  const cx=mouthX+.433*h-8, cy=mouthY-.125*h-6;
  const sx=from?from.left+from.width/2:cx+60, sy=from?from.top+from.height/2:cy-80;
  const b=document.createElement("div");
  b.className="pour-btl";b.innerHTML=bottleSvg(id);
  Object.assign(b.style,{width:w+"px",height:h+"px",left:(cx-w/2)+"px",top:(cy-h/2)+"px"});
  document.body.appendChild(b);
  const dx=sx-cx, dy=sy-cy;
  b.animate([
    {transform:`translate(${dx}px,${dy}px) rotate(0deg) scale(.85)`,opacity:.5,offset:0,easing:"ease-in-out"},
    {transform:"translate(0px,-14px) rotate(-20deg) scale(1)",opacity:1,offset:.32,easing:"ease-in-out"},
    {transform:"translate(0px,0px) rotate(-120deg) scale(1)",opacity:1,offset:.48,easing:"ease-in-out"},
    {transform:"translate(0px,0px) rotate(-124deg) scale(1)",opacity:1,offset:.82,easing:"ease-in-out"},
    {transform:"translate(10px,-20px) rotate(-10deg) scale(.9)",opacity:0,offset:1}
  ],{duration:POUR_MS,fill:"forwards"}).onfinish=()=>b.remove();
  const s=document.createElement("div");
  s.className="pour-stream";
  Object.assign(s.style,{left:(mouthX-2.5)+"px",top:mouthY+"px",height:Math.max(10,surf-mouthY)+"px",background:I[id].col});
  document.body.appendChild(s);
  s.animate([
    {transform:"scaleY(0)",opacity:1,offset:0},
    {transform:"scaleY(0)",opacity:1,offset:.46},
    {transform:"scaleY(1)",opacity:1,offset:.58},
    {transform:"scaleY(1)",opacity:1,offset:.8},
    {transform:"scaleY(1) translateY(30%)",opacity:0,offset:.92},
    {opacity:0,offset:1}
  ],{duration:POUR_MS,fill:"forwards"}).onfinish=()=>s.remove();
  // splash droplets at the surface
  setTimeout(()=>{
    for(let i=0;i<7;i++){
      const d=document.createElement("div");d.className="pour-drop";
      const r=3+Math.random()*3;
      Object.assign(d.style,{left:(mouthX-r/2)+"px",top:(surf-r/2)+"px",width:r+"px",height:r+"px",background:I[id].col});
      document.body.appendChild(d);
      const ax=(Math.random()-.5)*60, ay=-(14+Math.random()*26);
      d.animate([{transform:"translate(0,0)",opacity:1},{transform:`translate(${ax*.6}px,${ay}px)`,opacity:1,offset:.5},{transform:`translate(${ax}px,${ay*.2}px)`,opacity:0}],
        {duration:600,easing:"ease-out",fill:"forwards"}).onfinish=()=>d.remove();
    }
    $(".glass-box").animate([{transform:"rotate(0)"},{transform:"rotate(-2.5deg)"},{transform:"rotate(2deg)"},{transform:"rotate(0)"}],{duration:500,easing:"ease-out"});
  },POUR_MS*.58);
  return true;
}
function addToMix(id,quiet,from){
  if(mix.includes(id)){if(!quiet)toast(I[id].n+" כבר בשייקר");return}
  const anim=pourAnim(id,from);
  mix.push(id);save();renderMix(anim?POUR_MS*.55:0,anim?"one":undefined);renderShelf();
  setTimeout(()=>sfx("pour"),anim?POUR_MS*.3:0);
  if(!quiet&&!anim&&window.matchMedia("(max-width:720px)").matches)toast("נוסף לשייקר: "+I[id].n);
}

const SOUR=["lemon","lime"], SWEET=["syrup","honey","grenadine","triple","amaretto","coffee_liq","coconut","irish"];
const DAIRY=["cream","irish"], ACID=["lemon","lime","grapefruit","oj","pineapple","cranberry","tomato","tonic"];
const COFFEE=["coffee_liq","espresso"], TART=["lemon","lime","grapefruit","cranberry","tomato","tonic"];
const SWEETISH=["triple","amaretto","coffee_liq","irish","grenadine","pineapple","cranberry","cola","oj","aperol","coconut","honey"];

function rowHtml(r,sub){
  return`<button class="rrow" data-r="${r.id}"><span class="rico">${cocktailSvg(r)}</span>
    <span><span class="rname">${esc(r.n)}</span>${enOn?`<span class="ren" lang="en" dir="ltr">${esc(r.en)}</span>`:""}${favs.has(r.id)?`<span class="fav-dot" aria-label="מועדף">♥</span>`:""}<br><span class="rmeta">${sub}</span></span>
    <span class="tag">${r.t[0]}</span></button>`;
}
function ownedSub(r){const m=missingOwned(r);return m.length?`<span class="miss">חסר בבר: ${esc(listHe(m.map(i=>I[i].n)))}</span>`:`<span class="ok">יש לכם הכול</span>`}

function renderVerdict(){
  const v=$("#verdict"); const S=new Set(mix);
  if(!S.size){
    v.className="verdict";
    v.innerHTML=`<span class="badge">השייקר ריק</span><h3>מה נמזוג היום?</h3><p>גררו לכאן שניים או שלושה משקאות, ונגיד לכם אם השילוב עובד ואיזה קוקטייל יוצא ממנו.</p>`;
    return;
  }
  const names=mix.map(i=>I[i].n);
  const scored=R.map(r=>{
    const extra=[...S].filter(i=>!r.all.has(i)), miss=[...r.req].filter(i=>!S.has(i)), hit=[...S].filter(i=>r.all.has(i)).length;
    return{r,extra,miss,hit};
  });
  const exact=scored.filter(s=>!s.extra.length&&!s.miss.length);
  const near=scored.filter(s=>!s.extra.length&&s.miss.length&&s.miss.length<=2).sort((a,b)=>a.miss.length-b.miss.length||missingOwned(a.r).length-missingOwned(b.r).length);

  // clashes & tips
  const has=arr=>mix.some(i=>arr.includes(i));
  const clashes=[];
  if(has(DAIRY)&&has(ACID))clashes.push("שמנת עלולה להתגבן במגע עם מיץ חמוץ או טוניק.");
  if(has(COFFEE)&&has(TART))clashes.push("קפה וטעמים חמוצים בדרך כלל מתנגשים.");
  if(S.has("tomato")&&has(SWEETISH))clashes.push("מיץ עגבניות הולך עם טעמים מלוחים וחריפים, לא עם מתוק.");
  if(S.has("cola")&&(S.has("tonic")||S.has("ginger_beer")))clashes.push("שני משקאות תוססים בעלי טעם חזק מתחרים זה בזה.");
  const spirits=mix.filter(i=>I[i].c==="spirit");
  if(spirits.length>=3)clashes.push("שלושה סוגי אלכוהול בסיסי או יותר יוצרים משקה כבד שהטעמים בו מתנגשים.");
  if(mix.length>=7)clashes.push("הרבה מרכיבים מטשטשים את הטעם. נסו לצמצם לארבעה או חמישה.");

  const tips=[];
  const alcohol=mix.some(i=>["spirit","liqueur"].includes(I[i].c)&&i!=="angostura")||S.has("prosecco");
  if(!alcohol)tips.push("אין כאן אלכוהול, אז זה מוקטייל. מצוין גם לנהגים.");
  else if(mix.every(i=>I[i].c==="spirit"))tips.push("כרגע יש רק אלכוהול. הוסיפו מיקסר, מיץ או ליקר כדי לבנות קוקטייל.");
  if(spirits.length&&has(SOUR)&&!has(SWEET))tips.push("כדאי להוסיף מעט סירופ סוכר או דבש כדי לאזן את החמיצות.");
  if(spirits.length&&has(SWEET)&&!has(SOUR)&&!has(["soda","tonic","cola","ginger_beer","oj","cranberry","pineapple","grapefruit","cream","espresso","sweet_verm","campari"]))tips.push("מעט מיץ לימון ירענן את המשקה ויאזן את המתיקות.");

  const tipHtml=list=>list.length?`<ul class="tips">${list.map(t=>`<li>${t}</li>`).join("")}</ul>`:"";

  if(exact.length){
    const best=exact.sort((a,b)=>b.r.all.size-a.r.all.size)[0];
    const more=exact.slice(1);
    v.className="verdict perfect";
    v.innerHTML=`<span class="badge">שילוב מנצח</span><h3>יצא לכם ${esc(best.r.n)}!</h3>
      <p>${esc(listHe(names))} הם בדיוק המרכיבים של ${esc(best.r.n)}. לחצו כדי לראות כמויות והוראות הכנה.</p>
      <div class="rlist">${[best,...more].slice(0,3).map(s=>rowHtml(s.r,`${GLASS[s.r.g]} · ${METHOD[s.r.m]}`)).join("")}</div>${stepsHtml(best.r)}
      <div class="m-actions" style="margin-bottom:10px"><button class="btn primary" type="button" data-prep="${best.r.id}">הכנה צעד אחר צעד</button><button class="btn" type="button" data-made="${best.r.id}">הכנתי, לרשום ביומן</button><button class="btn" type="button" data-card="${best.r.id}">כרטיס לשיתוף</button></div>${tipHtml(clashes)}`;
    return;
  }
  if(near.length&&!clashes.length){
    v.className="verdict good";
    v.innerHTML=`<span class="badge">שילוב טוב</span><h3>אתם בדרך לקוקטייל מוכר</h3>
      <p>${mix.length>1?esc(listHe(names))+" הולכים טוב יחד.":"התחלה טובה."} הנה מה שחסר כדי להשלים:</p>
      <div class="rlist">${near.slice(0,4).map(s=>rowHtml(s.r,`<span class="miss">להוסיף: ${esc(listHe(s.miss.map(i=>I[i].n)))}</span>`)).join("")}</div>${tipHtml(tips)}`;
    return;
  }
  // pair compatibility
  let tot=0,known=0;
  for(let i=0;i<mix.length;i++)for(let j=i+1;j<mix.length;j++){tot++;if(pairs.has(mix[i]+"|"+mix[j]))known++}
  const ratio=tot?known/tot:1;
  const close=scored.filter(s=>s.hit>0).sort((a,b)=>b.hit-a.hit||a.extra.length-b.extra.length||a.miss.length-b.miss.length).slice(0,3);
  const closeHtml=close.length?`<p style="margin-top:10px">הקוקטיילים הכי קרובים למה שבשייקר:</p><div class="rlist">${close.map(s=>{
      const parts=[];if(s.miss.length)parts.push(`<span class="miss">להוסיף: ${esc(listHe(s.miss.map(i=>I[i].n)))}</span>`);
      if(s.extra.length)parts.push(`להוציא: ${esc(listHe(s.extra.map(i=>I[i].n)))}`);
      return rowHtml(s.r,parts.join(" · "));}).join("")}</div>`:"";
  if(clashes.length||ratio<.34){
    v.className="verdict bad";
    v.innerHTML=`<span class="badge">לא מומלץ</span><h3>השילוב הזה כנראה לא יעבוד</h3>
      ${clashes.length?tipHtml(clashes):`<p>${esc(listHe(names))} כמעט לא מופיעים יחד באף מתכון מוכר.</p>`}${closeHtml}`;
  } else {
    v.className="verdict maybe";
    v.innerHTML=`<span class="badge">שווה ניסיון</span><h3>שילוב ניסיוני שיכול לעבוד</h3>
      <p>רוב הצמדים כאן מופיעים יחד במתכונים קלאסיים, אבל אין קוקטייל מוכר עם בדיוק המרכיבים האלה.</p>${tipHtml(tips)}${closeHtml}`;
  }
}

/* Pointer drag (mouse, pen and touch with a short press) */
let drag=null;
const mixerEl=$("#mixer");
function overMixer(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest("#mixer, .mixer-col")}
let litT=null;
shelf.addEventListener("pointerdown",e=>{const b=e.target.closest(".btl");if(!b)return;document.querySelectorAll(".btl.lit").forEach(x=>x!==b&&x.classList.remove("lit"));b.classList.add("lit");litId=b.dataset.id;clearTimeout(litT)});

shelf.addEventListener("pointerdown",e=>{
  if(e.button>0)return;
  const c=e.target.closest(".chip, .btl"); if(!c||e.target.closest(".own, .lvl"))return;
  drag={id:c.dataset.id,el:c,x0:e.clientX,y0:e.clientY,started:false,cancel:false,type:e.pointerType,pid:e.pointerId,ghost:null};
  if(e.pointerType==="touch"){drag.timer=setTimeout(()=>{if(drag&&!drag.cancel)startDrag(e.clientX,e.clientY)},260)}
});
function startDrag(x,y){
  drag.started=true;
  try{drag.el.setPointerCapture(drag.pid)}catch(_){}
  const g=drag.el.cloneNode(true);g.classList.add("ghost");g.classList.remove("inmix");g.querySelector(".own")?.remove();g.querySelector(".lvl")?.remove();
  document.body.appendChild(g);drag.ghost=g;drag.el.classList.add("lifted");moveGhost(x,y);
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}
}
function moveGhost(x,y){const g=drag.ghost;g.style.right="auto";g.style.left=(x-g.offsetWidth/2)+"px";g.style.top=y+"px";g.style.transform="translate(0,-50%) rotate(-4deg) scale(1.06)";
  mixerEl.classList.toggle("over",!!overMixer(x,y))}
document.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  const d=Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0);
  if(!drag.started){
    if(drag.type==="touch"){if(d>8){drag.cancel=true;clearTimeout(drag.timer)}return}
    if(d>5)startDrag(e.clientX,e.clientY);else return;
  }
  moveGhost(e.clientX,e.clientY);
});
function endDrag(e,cancelled){
  if(!drag||e.pointerId!==drag.pid)return;
  clearTimeout(drag.timer);
  const d=drag;drag=null;
  if(d.started){
    const ok=!cancelled&&overMixer(e.clientX,e.clientY);
    const gr=d.ghost.getBoundingClientRect();
    d.ghost.remove();d.el.classList.remove("lifted");mixerEl.classList.remove("over");
    if(ok)addToMix(d.id,true,gr);
  } else if(!cancelled&&!d.cancel){addToMix(d.id,false,d.el.getBoundingClientRect())}
}
document.addEventListener("pointerup",e=>endDrag(e,false));
document.addEventListener("pointercancel",e=>endDrag(e,true));
document.addEventListener("touchmove",e=>{if(drag&&drag.started)e.preventDefault()},{passive:false});

/* ---------- Step-by-step method for every recipe ---------- */
const GLASS_TO={coupe:"לכוס הקוקטייל",martini:"לכוס המרטיני",rocks:"לכוס הנמוכה",high:"לכוס הגבוהה",wine:"לכוס היין",flute:"לכוס השמפניה",mug:"לספל הנחושת"};
const GLASS_THE={coupe:"את כוס הקוקטייל",martini:"את כוס המרטיני",rocks:"את הכוס הנמוכה",high:"את הכוס הגבוהה",wine:"את כוס היין",flute:"את כוס השמפניה",mug:"את ספל הנחושת"};
function ingTxt(x,n){return`${I[x.i].n} (${amtN(scaleA(x.a,n||1))}${x.o?", רשות":""})`}
function recipeSteps(r,n){
  n=n||1;
  const S=[], ice=iceInfo(r);
  const rim=r.ing.find(x=>x.i==="salt"&&x.a==="לשולי הכוס");
  const fills=r.ing.filter(x=>x.a===FILL||(r.m!=="build"&&x.i==="prosecco"&&r.m==="shake"));
  const muddle=r.ing.some(x=>x.i==="mint")&&r.m!=="blend";
  const main=r.ing.filter(x=>x!==rim&&!fills.includes(x)&&!(muddle&&x.i==="mint")&&x.i!=="egg_white");
  const egg=r.ing.find(x=>x.i==="egg_white");
  if(rim)S.push("מעבירים פלח ליים על שולי הכוס וטובלים אותם במלח.");
  if(r.m==="shake"){
    if(!ice.inGlass)S.push(`מקררים ${GLASS_THE[r.g]}: ממלאים בקרח או מכניסים למקפיא לכמה דקות.`);
    S.push(`מוזגים לשייקר: ${listHe(main.map(x=>ingTxt(x,n)))}.`);
    if(egg){S.push(`מוסיפים חלבון ביצה${egg.o?" (רשות)":""} ומנערים בלי קרח כ-10 שניות, כדי ליצור קצף.`)}
    S.push("ממלאים את השייקר בקרח וסוגרים היטב.");
    S.push("מנערים בחוזקה 12 עד 15 שניות, עד שהשייקר קר מאוד מבחוץ.");
    S.push(ice.inGlass?`ממלאים ${GLASS_THE[r.g]} בקרח טרי ומסננים לתוכה את המשקה.`.replace("לתוכה",r.g==="mug"?"לתוכו":"לתוכה"):`מסננים ${GLASS_TO[r.g]} המקוררת, בלי הקרח.`.replace("המקוררת",r.g==="mug"?"המקורר":"המקוררת"));
  } else if(r.m==="stir"){
    S.push("ממלאים כוס ערבוב גדולה בקרח.");
    S.push(`מוזגים לכוס הערבוב: ${listHe(main.map(x=>ingTxt(x,n)))}.`);
    S.push("מערבבים בכפית בר כ-30 שניות, עד שהמשקה קר מאוד.");
    S.push(ice.inGlass?`מסננים ${GLASS_TO[r.g]} עם קוביית קרח גדולה.`:`מסננים ${GLASS_TO[r.g]} המקוררת.`);
  } else if(r.m==="blend"){
    S.push(`מכניסים לבלנדר: ${listHe(main.map(x=>ingTxt(x,n)))}.`);
    if(muddle)S.push("מוסיפים את עלי הנענע.");
    S.push("מוסיפים כוס קרח וטוחנים עד למרקם חלק.");
    S.push(`מוזגים ${GLASS_TO[r.g]}.`);
  } else {
    if(muddle){
      const with_=r.ing.filter(x=>["lime","lemon","syrup","honey"].includes(x.i));
      S.push(`כותשים בעדינות את הנענע בתחתית הכוס${with_.length?" יחד עם "+listHe(with_.map(x=>ingTxt(x,n))):""}.`);
      const rest=main.filter(x=>!with_.includes(x));
      S.push(`ממלאים את הכוס בקרח${rest.length?" ומוסיפים "+listHe(rest.map(x=>ingTxt(x,n))):""}.`);
    } else {
      S.push(`ממלאים ${GLASS_THE[r.g]} בקרח.`);
      S.push(`מוזגים לפי הסדר: ${listHe(main.map(x=>ingTxt(x,n)))}.`);
    }
  }
  fills.forEach(x=>S.push(`משלימים ב${I[x.i].n}${x.a===FILL?" עד למעלה":` (${amtN(scaleA(x.a,n))})`}.`));
  if(r.m==="build")S.push([...r.all].some(i=>FIZZ.includes(i))?"מערבבים בעדינות פעם או פעמיים, כדי לא לאבד את הבועות.":"מערבבים קלות עם כפית בר.");
  const gs=garnishOf(r).map(t=>"ב"+GARN_HE[t]);
  if(gs.length)S.push(`מקשטים ${listHe(gs)} ומגישים מיד.`);else S.push("מגישים מיד.");
  return S;
}

const CG={
  high:{b:"M11 6h18l-1.6 35a3 3 0 0 1-3 3h-8.8a3 3 0 0 1-3-3z",top:12,bot:44,rim:[29,6],stem:0},
  rocks:{b:"M7 18h26l-2 23a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3z",top:23,bot:44,rim:[33,18],stem:0},
  mug:{b:"M7 16h24l-1 25a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3z",top:20,bot:44,rim:[31,16],stem:0},
  coupe:{b:"M4 10h32c0 9-7 15-16 15S4 19 4 10z",top:12,bot:25,rim:[36,10],stem:25},
  wine:{b:"M9 4h22c0 13-4 21-11 21S9 17 9 4z",top:11,bot:25,rim:[31,4],stem:25},
  martini:{b:"M4 8h32L20 26z",top:11,bot:26,rim:[35,8],stem:26},

};
function cocktailSvg(r){
  const id="cg"+(++cuid), s=CG[r.g]||CG.rocks;
  let cols=r.ing.filter(x=>I[x.i].w>=.3).map(x=>I[x.i].col).slice(0,3); if(!cols.length)cols=[rColor(r)];
  const h=(s.bot-s.top)/cols.length;
  const bands=cols.map((c,i)=>`<rect x="0" y="${(s.bot-h*(i+1)).toFixed(1)}" width="40" height="${(h+.5).toFixed(1)}" fill="${c}"/>`).join("");
  let g=`<defs><clipPath id="${id}"><path d="${s.b}"/></clipPath></defs>`;
  if(s.stem)g+=`<path d="M20 ${s.stem}V43M13 44h14" style="stroke:var(--glass)" stroke-width="2" stroke-linecap="round" fill="none" opacity=".85"/>`;
  g+=`<path d="${s.b}" fill="#fff" fill-opacity=".08"/><g clip-path="url(#${id})">${bands}<rect x="0" y="${s.top}" width="40" height="2" fill="#fff" opacity=".35"/></g>`;
  if(r.g==="mug")g+=`<path d="${s.b}" fill="#C27C48" opacity=".93"/><path d="M31 22h2.5a4.5 4.5 0 0 1 0 9H31" fill="none" stroke="#C27C48" stroke-width="2.4"/><rect x="9" y="22" width="20" height="3" fill="#E4A673" opacity=".6"/>`;
  else g+=`<path d="${s.b}" fill="none" style="stroke:var(--glass)" stroke-width="1.6" stroke-linejoin="round"/>`;
  const [rx,ry]=s.rim;
  if(r.all.has("mint"))g+=`<ellipse cx="${rx-6}" cy="${ry-3}" rx="4" ry="2.2" transform="rotate(-30 ${rx-6} ${ry-3})" fill="#5FAE58"/><ellipse cx="${rx-2}" cy="${ry-4}" rx="3.6" ry="2" transform="rotate(25 ${rx-2} ${ry-4})" fill="#6CBF63"/>`;
  const fruit=r.all.has("lime")?I.lime.col:r.all.has("lemon")?I.lemon.col:r.all.has("oj")?I.oj.col:null;
  if(fruit)g+=`<circle cx="${rx-1}" cy="${ry}" r="4.6" fill="${fruit}" stroke="${lighten(fruit,.55)}" stroke-width="1.2"/><path d="M${rx-1} ${ry-3.4}v6.8M${rx-4.4} ${ry}h6.8" stroke="${lighten(fruit,.55)}" stroke-width=".7"/>`;
  return`<svg viewBox="0 0 40 48" aria-hidden="true">${g}</svg>`;
}

/* ---------- Hero: cocktail of the evening ---------- */
function renderHero(now,one){
  const el=$("#hero");
  const day=Math.floor(Date.now()/864e5);
  const r=now.length?now[day%now.length]:one.length?one[day%one.length]:null;
  if(!r){el.innerHTML=`<div><span class="kicker">הקוקטייל של הערב</span><h2>הבר מחכה לכם<span>סמנו מה יש לכם על המדפים</span></h2><p>אחרי שתוסיפו כמה בקבוקים, נבחר בשבילכם קוקטייל לערב.</p></div>`;return}
  const miss=missingOwned(r);
  el.innerHTML=`<div style="position:relative;z-index:1">
      <span class="kicker">הקוקטייל של הערב</span>
      <h2>${esc(r.n)}<span>${r.t.join(" · ")}</span></h2>
      <p>${miss.length?`חסר לכם רק: ${esc(listHe(miss.map(i=>I[i].n)))}`:esc(listHe([...r.req].map(i=>I[i].n)))}</p>
      <button class="btn primary" id="heroGo" type="button">${miss.length?"לראות מתכון":"להכין עכשיו"}</button>
    </div>
    <div class="hero-art">${cocktailSvg(r)}<span class="hero-badge"><span><b>${r.req.size}</b>מרכיבים</span></span></div>`;
  $("#heroGo").onclick=()=>{
    if(miss.length){openRecipe(r.id);return}
    mix=[...r.req];save();renderShelf();
    const go=()=>{renderMix(0,"all");toast("השייקר מוכן: "+r.n)};
    const sec=$(".mixer-col"), rect=sec.getBoundingClientRect();
    if(rect.top<0||rect.top>innerHeight*.6){sec.scrollIntoView({behavior:"smooth",block:"start"});setTimeout(go,450)}else go();
  };
}

  const noAlc=/בלי אלכוהול|ללא אלכוהול|נוהג|נהג|מוקטייל/.test(text);
  const surprise=/תפתיע|הפתע|משהו אחר|מה שבא לך/.test(text);

  const scored=pool.map(r=>{

  return{reply:noAlc?"הנה משהו טעים בלי טיפת אלכוהול:":surprise?"הנה הפתעה מהבר שלכם:":ev?ev.line+" הנה מה שהייתי מכין:":"הנה מה שהייתי מכין לכם:",picks};
}

    img.onload=()=>{const max=1280,k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);

function logMade(id,quiet){hist.push({id,ts:Date.now()});if(hist.length>500)hist=hist.slice(-500);save();renderRecs();
  if(!quiet)toast("נרשם ביומן: "+R.find(r=>r.id===id).n)}
function starsHtml(id){const v=ratings[id]||0;
  return`<span class="stars" role="radiogroup" aria-label="הדירוג שלכם">${[1,2,3,4,5].map(n=>`<button type="button" class="${n<=v?"on":""}" data-star="${n}" data-rid="${id}" role="radio" aria-checked="${n===v}" aria-label="${n===1?"כוכב אחד":n+" כוכבים"}">★</button>`).join("")}</span>`}
function starsTxt(id){const v=ratings[id]||0;return v?"★".repeat(v)+"☆".repeat(5-v):""}

/* party amounts */
function scaleA(a,n){
  if(n===1)return a;
  if(typeof a==="number")return a*n;
  if(a===FILL||!/^\d/.test(a))return a;
  return a.replace(/^(\d+)\s*(.*)$/,(m,d,rest)=>((+d*n)+" "+({"כפית":"כפיות","פלח":"פלחים"}[rest]||rest)).trim());
}
function amtN(a){return typeof a==="number"&&a>=1000?(a/1000).toLocaleString("he-IL",{maximumFractionDigits:2})+" ליטר":amt(a)}
function partyTip(r,n){
  const tot=r.ing.reduce((s,x)=>s+(typeof x.a==="number"?x.a:0),0)*n;
  const fizz=r.ing.some(x=>FIZZ.includes(x.i));
  let t=r.m==="shake"?"מנערים עד שתי מנות בכל פעם, כדי שכל כוס תקבל ניעור מלא."
    :r.m==="blend"?"בבלנדר רגיל נכנסות בערך ארבע מנות בכל פעם."
    :`אפשר להכין את הבסיס בקנקן מראש ולשמור במקרר. את הקרח${fizz?" והמשקאות התוססים":""} מוסיפים רק לפני ההגשה.`;
  return`${t} סך הכול כ-${amtN(tot)} נוזלים, לפני קרח${fizz?" ומוגזים":""}.`;
}

/* generic modal */
let modalClose=null;
function showModal(html,label){
  if(modalClose)modalClose(true);
  const prev=document.activeElement;
  $("#modalRoot").innerHTML=`<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(label)}" dir="rtl" lang="he">${html}</div></div>`;
  const onKey=e=>{if(e.key==="Escape")close()};
  const close=silent=>{document.removeEventListener("keydown",onKey);$("#modalRoot").innerHTML="";modalClose=null;
    if(!silent&&prev&&prev.focus&&document.contains(prev))try{prev.focus({preventScroll:true})}catch(_){}};
  document.addEventListener("keydown",onKey);
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")close()});
  modalClose=close;
  return $("#scrim .modal");
}
function closeModal(){if(modalClose)modalClose()}

/* shopping list */
function nextBottle(){
  const gain={};R.filter(r=>missingOwned(r).length===1).forEach(r=>{const m=missingOwned(r)[0];(gain[m]=gain[m]||[]).push(r.n)});
  return Object.entries(gain).sort((a,b)=>b[1].length-a[1].length)[0]||null;
}
function shopItems(){
  const map=new Map();
  const get=id=>{if(!map.has(id))map.set(id,{id,low:false,man:false,favs:[],tip:""});return map.get(id)};
  [...owned].filter(id=>lv(id)===1).forEach(id=>get(id).low=true);
  shopManual.forEach(id=>{if(I[id]&&(!owned.has(id)||lv(id)===1))get(id).man=true});
  R.filter(r=>favs.has(r.id)).forEach(r=>missingOwned(r).forEach(id=>get(id).favs.push(r.n)));
  const nb=nextBottle(); if(nb)get(nb[0]).tip=`פותח ${nb[1].length===1?"קוקטייל חדש":nb[1].length+" קוקטיילים חדשים"}`;

}

/* prep mode: one big step at a time, with timers */
let AC=null;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC}catch(e){return null}}
function beep(){if(typeof soundOn!=="undefined"&&!soundOn)return;const c=ac();if(!c)return;[0,.2,.4].forEach((t,k)=>{const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=k===2?1320:880;
  const s=c.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.22,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+.17);o.connect(g).connect(c.destination);o.start(s);o.stop(s+.2)})}
function stepSecs(t){const m=t.match(/(?:(\d+) עד )?(\d+) שניות/);return m?+m[2]:0}
function openPrep(r,n){
  n=n||1;
  const steps=recipeSteps(r,n);let i=0,raf=0,wake=null,logged=false;
  const root=document.createElement("div");root.id="prepRoot";document.body.appendChild(root);
  document.body.classList.add("noscroll");
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{})}catch(e){}
  const close=()=>{cancelAnimationFrame(raf);document.removeEventListener("keydown",onKey);root.remove();document.body.classList.remove("noscroll");try{wake&&wake.release()}catch(e){}};
  const onKey=e=>{if(e.key==="Escape")close();else if(e.key==="ArrowLeft")go(1);else if(e.key==="ArrowRight")go(-1)};
  document.addEventListener("keydown",onKey);
  const go=d=>{if(i+d<0)return;cancelAnimationFrame(raf);if(i+d>steps.length){return}i+=d;draw()};
  const draw=()=>{
    const done=i>=steps.length;
    if(done&&!logged){logged=true;logMade(r.id,true)}
    const secs=done?0:stepSecs(steps[i]);
    root.innerHTML=`<div class="prep" role="dialog" aria-modal="true" aria-label="הכנת ${esc(r.n)}" dir="rtl" lang="he">
      <div class="prep-top"><button class="xbtn" type="button" id="pX" aria-label="יציאה ממצב הכנה">×</button>
        <div class="prep-title"><b>${esc(r.n)}</b><span>${n>1?n+" מנות · ":""}${GLASS[r.g]} · ${METHOD[r.m]}</span></div></div>
      <div class="prog" aria-hidden="true"><i style="width:${Math.min(100,i/steps.length*100)}%"></i></div>
      ${done?`<div class="prep-mid"><div class="prep-cat">${catGrey("pd")}</div><p class="ptext">לחיים! המשקה מוכן.</p><p class="hint">נרשם ביומן. איך יצא?</p>${starsHtml(r.id)}</div>
        <div class="prep-nav"><button class="btn" type="button" id="pAgain">שוב מההתחלה</button><button class="btn primary" type="button" id="pEnd">סיום</button></div>`
      :`<div class="prep-mid"><span class="pnum">שלב ${i+1} מתוך ${steps.length}</span><p class="ptext" aria-live="polite">${esc(steps[i])}</p>
        ${secs?`<button class="ptimer" type="button" id="pT" aria-label="טיימר ${secs} שניות"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" class="tr"/><circle cx="60" cy="60" r="52" class="tf" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg><span><b>${secs}</b><small>שניות · להפעלה</small></span></button>`:""}
        ${i===0?`<div class="prep-ings">${r.ing.map(x=>`<span class="mi"><span class="drop" style="--c:${I[x.i].col}"></span>${esc(I[x.i].n)} · ${esc(amtN(scaleA(x.a,n)))}</span>`).join("")}</div>`:""}</div>
        <div class="prep-nav"><button class="btn" type="button" id="pPrev" ${i===0?"disabled":""}>הקודם</button><button class="btn primary" type="button" id="pNext">${i===steps.length-1?"סיימתי":"הבא"}</button></div>`}
    </div>`;
    $("#pX").onclick=close;
    if(done){$("#pAgain").onclick=()=>{i=0;draw()};$("#pEnd").onclick=close;$("#pEnd").focus();return}
    $("#pPrev").onclick=()=>go(-1);$("#pNext").onclick=()=>go(1);$("#pNext").focus({preventScroll:true});
    const tb=$("#pT");
    if(tb)tb.onclick=()=>{
      if(tb.classList.contains("run"))return;
      tb.classList.add("run");tb.classList.remove("done");
      const t0=performance.now(),f=tb.querySelector(".tf"),num=tb.querySelector("b"),lab=tb.querySelector("small");lab.textContent="שניות";
      const tick=now=>{const left=Math.max(0,secs-(now-t0)/1000);num.textContent=Math.ceil(left);f.setAttribute("stroke-dashoffset",String(100-left/secs*100));
        if(left>0){raf=requestAnimationFrame(tick);return}
        tb.classList.remove("run");tb.classList.add("done");num.textContent="✓";lab.textContent="מוכן! עוד פעם?";beep();try{navigator.vibrate&&navigator.vibrate([120,80,120])}catch(e){}};
      raf=requestAnimationFrame(tick);
    };
  };
  draw();
}

/* recipe book filters */
let rq="",fT=new Set(),fS=new Set(),fQuick=false;
const TASTES=[...new Set(R.flatMap(r=>r.t))].filter(t=>t!=="חזק");
const STR_L=[["none","בלי אלכוהול"],["light","קליל"],["mid","בינוני"],["strong","חזק"]];
function fActive(){return fT.size||fS.size||fQuick||rq.trim()}
function renderFChips(){
  $("#fchips").innerHTML=`<div class="fgrp"><span class="flbl">טעם</span>${TASTES.map(t=>`<button type="button" class="fchip" data-ft="${t}" aria-pressed="${fT.has(t)}">${t}</button>`).join("")}</div>
    <div class="fgrp"><span class="flbl">חוזק</span>${STR_L.map(([k,l])=>`<button type="button" class="fchip" data-fs="${k}" aria-pressed="${fS.has(k)}">${l}</button>`).join("")}</div>
    <div class="fgrp"><span class="flbl">זמן</span><button type="button" class="fchip" data-fq aria-pressed="${fQuick}">עד 2 דקות</button>${fActive()?`<button type="button" class="linkbtn" data-fclear style="margin-inline-start:auto">ניקוי הסינון</button>`:""}</div>`;
}
function passF(r){
  if(fT.size&&!r.t.some(t=>fT.has(t)))return false;
  if(fS.size&&!fS.has(r.st.k))return false;
  if(fQuick&&r.min>2)return false;
  const q=rq.trim();
  if(q&&!(r.n.includes(q)||r.en.toLowerCase().includes(q.toLowerCase())||[...r.all].some(i=>I[i].n.includes(q))))return false;
  return true;
}
$("#fchips").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.ft){fT.has(b.dataset.ft)?fT.delete(b.dataset.ft):fT.add(b.dataset.ft)}
  else if(b.dataset.fs){fS.has(b.dataset.fs)?fS.delete(b.dataset.fs):fS.add(b.dataset.fs)}
  else if("fq" in b.dataset)fQuick=!fQuick;
  else if("fclear" in b.dataset){fT.clear();fS.clear();fQuick=false;rq="";$("#rq").value=""}
  renderRecs();
